<!doctype html>
<html lang="vi"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><meta name="theme-color" content="#14263f"><title>VELOBOX · Demo vận hành locker</title>
<style>
:root{--navy:#14263f;--blue:#286dfa;--teal:#13b8b0;--bg:#f3f6fb;--line:#e5ebf3;--muted:#728198;--ink:#19283d;--green:#16986b;--orange:#d78825;--red:#d95050}*{box-sizing:border-box}body{margin:0;background:var(--bg);color:var(--ink);font:14px/1.5 Inter,system-ui,-apple-system,"Segoe UI",sans-serif}button,input,select{font:inherit}button{cursor:pointer}.shell{min-height:100vh}.side{position:fixed;inset:0 auto 0 0;width:245px;background:var(--navy);color:#dbe5f2;padding:20px 14px;overflow:auto}.brand{font-weight:850;color:white;font-size:19px;padding:4px 10px 22px}.brand small{display:block;font-size:9px;color:#92a7c3;letter-spacing:1.3px}.group{color:#8196b2;font-size:10px;font-weight:800;letter-spacing:1px;padding:13px 10px 6px}.nav{width:100%;border:0;background:transparent;color:#bdcbe0;text-align:left;padding:10px;border-radius:8px;margin:2px 0;font-size:12px}.nav:hover,.nav.on{background:#286dfa;color:white}.main{margin-left:245px}.top{height:68px;background:white;border-bottom:1px solid var(--line);display:flex;align-items:center;justify-content:space-between;padding:0 26px;position:sticky;top:0;z-index:2}.top select{border:1px solid var(--line);border-radius:8px;padding:8px;background:white}.wrap{max-width:1440px;padding:26px;margin:auto}.head{display:flex;justify-content:space-between;gap:15px;align-items:flex-start;margin-bottom:18px}.eyebrow{color:var(--blue);font-size:10px;font-weight:800;letter-spacing:1px}.head h1{margin:4px 0;font-size:25px}.head p{margin:0;color:var(--muted);font-size:12px}.btn{border:1px solid var(--line);background:white;padding:9px 13px;border-radius:8px;color:#40536b;font-weight:650;font-size:12px}.primary{background:var(--blue);color:white;border-color:var(--blue)}.cards{display:grid;grid-template-columns:repeat(4,1fr);gap:13px;margin-bottom:15px}.card,.stat{background:white;border:1px solid var(--line);border-radius:12px;padding:16px;box-shadow:0 8px 22px #1b355508}.stat label{color:var(--muted);font-size:11px}.stat strong{display:block;font-size:25px;margin:8px 0 2px}.stat small{color:var(--muted);font-size:10px}.grid{display:grid;grid-template-columns:1.2fr .8fr;gap:14px}.card h2{font-size:14px;margin:0 0 5px}.muted{color:var(--muted);font-size:11px}.flow{display:grid;grid-template-columns:repeat(6,1fr);gap:8px;margin-top:16px}.flow div{background:#f8faff;border:1px solid var(--line);border-radius:9px;padding:12px 8px;text-align:center;font-size:10px}.flow b{display:block;font-size:11px;margin-bottom:3px}.empty{padding:35px 12px;text-align:center;color:var(--muted);font-size:12px}.table{width:100%;border-collapse:collapse;margin-top:12px}.table th{text-align:left;color:#8190a3;font-size:10px;padding:9px;border-bottom:1px solid var(--line)}.table td{font-size:11px;padding:10px 9px;border-bottom:1px solid #f0f3f7}.tag{padding:4px 8px;border-radius:20px;background:#edf3ff;color:#2864d5;font-size:9px}.row{display:flex;align-items:center;justify-content:space-between;padding:11px 0;border-bottom:1px solid #eff2f6;font-size:11px}.cell-grid{display:grid;grid-template-columns:repeat(6,1fr);gap:8px;margin-top:12px}.cell{border:1px solid #dce9e3;background:#edfaf3;border-radius:8px;padding:12px 5px;text-align:center;font-size:10px}.cell.occupied{background:#eef4ff;border-color:#dce7fb}.cell.offline{background:#fff0f0;border-color:#f3d0d0}.toast{position:fixed;right:20px;top:82px;background:#173553;color:white;padding:11px 16px;border-radius:9px;display:none;z-index:5}.toast.show{display:block}.veil{position:fixed;inset:0;background:#14263f77;display:none;place-items:center;padding:16px;z-index:4}.veil.open{display:grid}.modal{background:white;border-radius:13px;padding:20px;width:min(430px,100%)}.modal h2{margin:0 0 12px;font-size:17px}.modal input,.modal select{width:100%;padding:10px;border:1px solid var(--line);border-radius:8px;margin:5px 0 12px}.modal label{font-size:11px;color:#5d6d81}.actions{display:flex;justify-content:flex-end;gap:8px}.notice{background:#fff8e9;border:1px solid #f5e4c3;color:#775218;border-radius:9px;padding:11px 13px;font-size:11px;margin-bottom:14px}.mobile{display:none}
@media(max-width:850px){.side{transform:translateX(-100%);z-index:3;transition:.2s}.side.open{transform:translateX(0)}.main{margin-left:0}.mobile{display:inline-block;border:0;background:none;font-size:20px}.top{padding:0 14px}.wrap{padding:18px 13px}.cards{grid-template-columns:repeat(2,1fr)}.grid{grid-template-columns:1fr}.flow{grid-template-columns:repeat(3,1fr)}.head{flex-direction:column}.cell-grid{grid-template-columns:repeat(4,1fr)}}
</style></head><body><aside class="side" id="side"><div class="brand">⌂ VELOBOX<small>SMART LOCKER · BẢN DEMO</small></div><div class="group">TỔNG QUAN</div><button class="nav on" data-page="dashboard">▦　Dashboard</button><button class="nav" data-page="orders">▤　Đơn hàng</button><button class="nav" data-page="lockers">▦　Trạm & ngăn tủ</button><button class="nav" data-page="delivery">⇄　Giao nhận & OTP</button><button class="nav" data-page="customers">♙　Cư dân & nhận hàng</button><div class="group">VẬN HÀNH</div><button class="nav" data-page="overdue">◷　Quá hạn & thu hồi</button><button class="nav" data-page="incidents">⚠　Sự cố & remote unlock</button><button class="nav" data-page="payments">₫　Thanh toán & e-invoice</button><button class="nav" data-page="integrations">⌘　API / Webhook</button><div class="group">QUẢN TRỊ</div><button class="nav" data-page="users">♧　Tài khoản & RBAC</button><button class="nav" data-page="logs">≡　Operation / Audit log</button><button class="nav" data-page="analytics">▥　Analytics</button><div class="group">Chatbot FAQ</div><button class="nav" data-page="chatbot">✦　Trợ lý VELOBOX</button></aside>
<main class="main"><header class="top"><div><button class="mobile" id="hamb">☰</button>　VELOBOX / <b id="crumb">Dashboard</b></div><div style="display:flex;gap:10px;align-items:center"><span class="muted">Vai trò demo</span><select id="role"><option>Admin hệ thống</option><option>Quản trị viên / BQL</option><option>Shipper / Đối tác</option><option>Cư dân / Khách hàng</option></select></div></header><section class="wrap" id="view"></section></main><div id="toast" class="toast"></div><div class="veil" id="veil"><div class="modal" id="modal"></div></div>
<script>
const labels={dashboard:"Dashboard",orders:"Đơn hàng",lockers:"Trạm & ngăn tủ",delivery:"Giao nhận & OTP",customers:"Cư dân & nhận hàng",overdue:"Quá hạn & thu hồi",incidents:"Sự cố & remote unlock",payments:"Thanh toán & e-invoice",integrations:"API / Webhook",users:"Tài khoản & RBAC",logs:"Operation / Audit log",analytics:"Analytics",chatbot:"Trợ lý VELOBOX"};
let db=JSON.parse(localStorage.getItem("velobox-demo")||'{"orders":[],"incidents":[],"users":[],"cells":[],"logs":[]}'),page="dashboard";
function save(){localStorage.setItem("velobox-demo",JSON.stringify(db))}function esc(s){return String(s||"").replace(/[&<>"]/g,c=>({"&":"&amp;","<":"&lt;",">":"&gt;",'"':"&quot;"}[c]))}function toast(s){let t=document.querySelector("#toast");t.textContent=s;t.classList.add("show");setTimeout(()=>t.classList.remove("show"),2400)}
function log(action,detail){db.logs.unshift({time:new Date().toLocaleString("vi-VN"),action,detail});save()}
function head(k,title,desc,act=""){return '<div class="head"><div><div class="eyebrow">'+k+'</div><h1>'+title+'</h1><p>'+desc+'</p></div>'+act+'</div>'}
function stats(){return '<div class="cards">'+[['Đơn hàng',db.orders.length,'▤'],['Ngăn đang dùng',db.cells.filter(x=>x.state==="occupied").length,'▦'],['Sự cố mở',db.incidents.filter(x=>!x.done).length,'⚠'],['Tài khoản',db.users.length,'♙']].map(x=>'<div class="stat"><label>'+x[0]+'</label><strong>'+x[1]+'</strong><small>'+x[2]+'　Dữ liệu demo trên trình duyệt</small></div>').join("")+'</div>'}
function table(rows,keys){if(!rows.length)return '<div class="empty">Chưa có dữ liệu. Dùng nút thao tác để thêm thông tin vào bản demo.</div>';return '<div style="overflow:auto"><table class="table"><thead><tr>'+keys.map(k=>'<th>'+k[1]+'</th>').join("")+'</tr></thead><tbody>'+rows.map(r=>'<tr>'+keys.map(k=>'<td>'+esc(r[k[0]])+'</td>').join("")+'</tr>').join("")+'</tbody></table></div>'}
function render(){document.querySelector("#crumb").textContent=labels[page];document.querySelectorAll(".nav").forEach(n=>n.classList.toggle("on",n.dataset.page===page));let v=document.querySelector("#view"),role=document.querySelector("#role").value;
if(page==="dashboard"){v.innerHTML=head("TRUNG TÂM VẬN HÀNH","VELOBOX · "+role,"Bản demo tương tác. Dữ liệu mới do bạn nhập được lưu cục bộ trong trình duyệt.",'<button class="btn primary" data-do="order">＋ Tạo đơn</button>')+stats()+'<div class="grid"><div class="card"><h2>Vòng đời giao nhận</h2><p class="muted">Theo dõi quy trình từ lúc nhận đơn đến khi hoàn tất.</p><div class="flow">'+[['1','Tạo / đồng bộ đơn'],['2','Giữ chỗ locker'],['3','Shipper gửi hàng'],['4','OTP / QR'],['5','Cư dân nhận hàng'],['6','Log & analytics']].map(x=>'<div><b>'+x[0]+' · '+x[1]+'</b>Trạng thái được mô phỏng</div>').join("")+'</div></div><div class="card"><h2>Tác vụ nhanh</h2><div class="row">Quản lý tài khoản & quyền <span class="tag">RBAC</span></div><div class="row">Thanh toán và hóa đơn điện tử <span class="tag">Demo</span></div><div class="row">Tích hợp đối tác <span class="tag">API</span></div><div class="row">Hỗ trợ cư dân <span class="tag">Chatbot</span></div></div></div>'}
else if(page==="orders"){v.innerHTML=head("VẬN HÀNH","Đơn hàng","Tạo đơn và thay đổi trạng thái giả lập.",'<button class="btn primary" data-do="order">＋ Tạo đơn</button>')+'<div class="card">'+table(db.orders,[["code","Mã đơn"],["recipient","Người nhận"],["status","Trạng thái"],["cell","Locker"],["amount","Phí"]])+'</div>'}
else if(page==="lockers"){v.innerHTML=head("IOT & ĐIỂM TỦ","Trạm & ngăn tủ","Sơ đồ ngăn locker demo; trạng thái thay đổi khi gửi đơn.")+'<div class="card"><h2>VELOBOX · Trạm mẫu hiển thị</h2><p class="muted">Locker station · trạng thái mô phỏng</p><div class="cell-grid">'+Array.from({length:12},(_,i)=>'<div class="cell '+(db.cells[i]?.state||"")+'">A-'+String(i+1).padStart(2,"0")+'<br><small>'+(db.cells[i]?.state==="occupied"?"Đang dùng":"Trống")+'</small></div>').join("")+'</div></div>'}
else if(page==="delivery"){v.innerHTML=head("LUỒNG GIAO NHẬN","Giao hàng & OTP","Shipper chọn đơn, mô phỏng gửi hàng vào locker và cấp OTP.")+'<div class="card">'+table(db.orders,[["code","Mã đơn"],["recipient","Người nhận"],["status","Trạng thái"],["otp","OTP demo"]])+'<button class="btn primary" data-do="deposit">Mô phỏng gửi hàng</button>　<button class="btn" data-do="pickup">Mô phỏng nhận hàng</button></div>'}
else if(page==="customers"){v.innerHTML=head("CƯ DÂN","Nhận hàng","Tra cứu đơn, nhập OTP để xác nhận nhận hàng.")+'<div class="card">'+table(db.orders,[["code","Mã đơn"],["recipient","Người nhận"],["status","Trạng thái"],["otp","OTP demo"]])+'<button class="btn primary" data-do="pickup">Xác nhận OTP</button></div>'}
else if(page==="overdue"){let rows=db.orders.filter(x=>x.status==="Quá hạn");v.innerHTML=head("VẬN HÀNH","Quá hạn & thu hồi","Đánh dấu đơn quá hạn và theo dõi thu hồi.",'<button class="btn" data-do="overdue">Đánh dấu quá hạn</button>')+'<div class="card">'+table(rows,[["code","Mã đơn"],["recipient","Người nhận"],["cell","Locker"],["status","Trạng thái"]])+'</div>'}
else if(page==="incidents"){v.innerHTML=head("HỖ TRỢ","Sự cố & remote unlock","Tạo sự cố hoặc mô phỏng yêu cầu mở tủ; mọi thao tác được ghi audit.",'<button class="btn primary" data-do="incident">＋ Tạo sự cố</button>')+'<div class="notice">Remote unlock ở bản demo chỉ cập nhật nhật ký trình duyệt, không điều khiển thiết bị thật.</div><div class="card">'+table(db.incidents,[["title","Sự cố"],["priority","Ưu tiên"],["status","Trạng thái"],["time","Thời điểm"]])+'<button class="btn" data-do="unlock">Gửi yêu cầu remote unlock</button></div>'}
else if(page==="payments"){v.innerHTML=head("TÀI CHÍNH","Thanh toán & e-invoice","Các nút mô phỏng luồng thanh toán; không thu tiền thật.")+'<div class="notice">Trang demo không kết nối cổng thanh toán và không phát hành hóa đơn hợp lệ.</div><div class="card"><h2>Thanh toán đơn hàng</h2>'+table(db.orders,[["code","Mã đơn"],["amount","Số tiền"],["payment","Thanh toán"],["invoice","E-invoice"]])+'<button class="btn primary" data-do="pay">Mô phỏng thanh toán</button></div>'}
else if(page==="integrations"){v.innerHTML=head("KẾT NỐI","API / Webhook","Màn hình cấu hình minh họa cho đối tác vận chuyển và nền tảng thương mại điện tử.")+'<div class="card"><div class="row">Đồng bộ đơn hàng <span class="tag">Webhook</span></div><div class="row">Đối tác vận chuyển <span class="tag">REST API</span></div><div class="row">Trạng thái hiện tại <span class="tag">Chưa kết nối</span></div><button class="btn" data-do="integration">Thử webhook demo</button></div>'}
else if(page==="users"){v.innerHTML=head("QUẢN TRỊ","Tài khoản & RBAC","Tạo tài khoản demo và xem vai trò được phân quyền.",'<button class="btn primary" data-do="user">＋ Thêm tài khoản</button>')+'<div class="card">'+table(db.users,[["name","Họ tên"],["email","Email"],["role","Vai trò"]])+'<div class="row">SYSTEM_ADMIN <span>Quản trị toàn hệ thống</span></div><div class="row">BUILDING_ADMIN <span>Vận hành tòa nhà</span></div><div class="row">SHIPPER <span>Giao hàng vào locker</span></div><div class="row">RESIDENT <span>Nhận hàng và thanh toán</span></div></div>'}
else if(page==="logs"){v.innerHTML=head("KIỂM SOÁT","Operation / Audit log","Nhật ký thao tác của bản demo trên trình duyệt.")+'<div class="card">'+table(db.logs,[["time","Thời điểm"],["action","Hành động"],["detail","Chi tiết"]])+'</div>'}
else if(page==="analytics"){v.innerHTML=head("BÁO CÁO","Analytics","Chỉ số tổng hợp từ các bản ghi bạn tạo trong phiên demo.")+stats()+'<div class="card">Đơn hàng: '+db.orders.length+' · Sự cố: '+db.incidents.length+' · Tài khoản: '+db.users.length+'</div>'}
else {v.innerHTML=head("HỖ TRỢ","Chatbot VELOBOX","Trợ lý FAQ minh họa với câu trả lời dựng sẵn.")+'<div class="card"><h2>Xin chào! Bạn cần hỗ trợ gì?</h2><p class="muted">Chọn một câu hỏi phổ biến:</p><button class="btn" data-do="faq" data-q="otp">Tôi lấy OTP ở đâu?</button> <button class="btn" data-do="faq" data-q="overdue">Đơn quá hạn xử lý thế nào?</button><div id="answer" class="row"></div></div>'}}
function openForm(kind){let fields=kind==="order"?'<label>Mã đơn<input id="f1" required></label><label>Người nhận<input id="f2" required></label><label>Phí dự kiến (₫)<input id="f3" type="number" value="0"></label>':kind==="incident"?'<label>Mô tả sự cố<input id="f1" required></label><label>Ưu tiên<select id="f2"><option>Thường</option><option>Cao</option></select></label>':'<label>Họ tên<input id="f1" required></label><label>Email<input id="f2" type="email" required></label><label>Vai trò<select id="f3"><option>BUILDING_ADMIN</option><option>SHIPPER</option><option>RESIDENT</option></select></label>';document.querySelector("#modal").innerHTML='<h2>'+({order:"Tạo đơn hàng",incident:"Tạo sự cố",user:"Thêm tài khoản"}[kind])+'</h2>'+fields+'<div class="actions"><button class="btn" data-do="close">Hủy</button><button class="btn primary" data-do="save" data-kind="'+kind+'">Lưu demo</button></div>';document.querySelector("#veil").classList.add("open")}
function act(e){let a=e.target.closest("[data-do]");if(!a)return;let k=a.dataset.do;if(k==="close"){document.querySelector("#veil").classList.remove("open");return}if(["order","incident","user"].includes(k)){openForm(k);return}if(k==="save"){if(a.dataset.kind==="order"){db.orders.push({code:document.querySelector("#f1").value,recipient:document.querySelector("#f2").value,status:"Đang xử lý",cell:"—",amount:Number(document.querySelector("#f3").value)||0,otp:"—",payment:"Chưa thanh toán",invoice:"Chưa phát hành"})}if(a.dataset.kind==="incident")db.incidents.push({title:document.querySelector("#f1").value,priority:document.querySelector("#f2").value,status:"Mới",time:new Date().toLocaleString("vi-VN")});if(a.dataset.kind==="user")db.users.push({name:document.querySelector("#f1").value,email:document.querySelector("#f2").value,role:document.querySelector("#f3").value});log("Tạo "+a.dataset.kind,"Bản ghi demo");document.querySelector("#veil").classList.remove("open");render();return}if(k==="deposit"){let o=db.orders.find(x=>x.status==="Đang xử lý");if(!o)return toast("Tạo đơn hàng trước.");let n=db.cells.length;let cell="A-"+String(n+1).padStart(2,"0");db.cells.push({state:"occupied"});o.status="Đã vào locker";o.cell=cell;o.otp=String(Math.floor(100000+Math.random()*900000));log("Gửi hàng vào locker",o.code);save();render();toast("OTP demo: "+o.otp);return}if(k==="pickup"){let o=db.orders.find(x=>x.status==="Đã vào locker");if(!o)return toast("Chưa có đơn đang ở locker.");let otp=prompt("Nhập OTP demo:");if(otp===o.otp){o.status="Đã nhận";let c=db.cells.pop();if(c)c.state="";log("Cư dân nhận hàng",o.code);save();render();toast("Xác thực thành công.")}else if(otp!==null)toast("OTP chưa chính xác.");return}if(k==="overdue"){let o=db.orders.find(x=>x.status==="Đã vào locker");if(!o)return toast("Không có đơn trong locker.");o.status="Quá hạn";log("Đánh dấu quá hạn",o.code);save();render();return}if(k==="unlock"){log("Remote unlock yêu cầu","Mô phỏng, không điều khiển thiết bị");toast("Đã ghi audit demo.");return}if(k==="pay"){let o=db.orders.find(x=>x.status==="Đã nhận"&&x.payment!=="Đã thanh toán");if(!o)return toast("Cần đơn đã nhận hàng.");o.payment="Đã thanh toán (demo)";o.invoice="E-invoice demo";log("Mô phỏng thanh toán",o.code);save();render();return}if(k==="integration"){log("Webhook thử nghiệm","Không gửi request ra ngoài");toast("Webhook mô phỏng thành công.");return}if(k==="faq"){document.querySelector("#answer").textContent=a.dataset.q==="otp"?"OTP hiển thị sau khi shipper gửi hàng vào locker.":"BQL kiểm tra đơn trong mục Quá hạn và liên hệ cư dân.";return}}
document.addEventListener("click",e=>{let nav=e.target.closest("[data-page]");if(nav){page=nav.dataset.page;render();document.querySelector("#side").classList.remove("open");return}act(e)});document.querySelector("#role").addEventListener("change",render);document.querySelector("#hamb").onclick=()=>document.querySelector("#side").classList.toggle("open");document.querySelector("#veil").onclick=e=>{if(e.target.id==="veil")e.currentTarget.classList.remove("open")};render();
</script></body></html>
